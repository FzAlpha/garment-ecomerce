<!doctype html>
<!-- Vérane × Velvané — designed & built by Velvané studio · https://website-checker-lmdx.vercel.app/ -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vérane — Product</title>
  <meta name="author" content="Velvané">
  <meta name="description" content="A piece from the Vérane Autumn — Winter 2026 collection, made in our Paris atelier.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%231f1913'/%3E%3Ctext x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-family='Georgia,serif' font-size='44' fill='%23f1e8db'%3EV%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://images.unsplash.com">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>
    document.documentElement.classList.add('js');
    try { if (sessionStorage.getItem('veil')) document.documentElement.classList.add('veil-in'); } catch (e) {}
  </script>
</head>
<body data-page="product" id="top">

  <!-- Page transition veil -->
  <div class="veil" data-veil aria-hidden="true">
    <div class="veil__col"></div><div class="veil__col"></div><div class="veil__col"></div><div class="veil__col"></div><div class="veil__col"></div>
    <div class="veil__label"><span data-veil-text></span></div>
  </div>

  <main>
    <section class="pdp wrap">
      <div class="grid pdp__grid">
        <div class="pdp__gallery" data-pdp-gallery></div>
        <div class="pdp__info">
          <h1 class="pdp__name" data-pdp-name>—</h1>
          <p class="pdp__price" data-pdp-price></p>
          <p class="body-copy pdp__desc" data-pdp-desc></p>
          <div class="pdp__opt">
            <div class="pdp__opt-head small"><span>Size</span><span class="muted" data-size-label></span></div>
            <div class="sizes" data-sizes></div>
          </div>
          <div class="pdp__actions">
            <button class="btn btn--block" data-add>Add to bag</button>
            <a href="atelier.html#contact" class="link link--line pdp__fitting" data-label="Atelier">Book a fitting</a>
          </div>
          <div class="accordion">
            <div class="accordion__item">
              <button class="accordion__btn" aria-expanded="false">Details <span class="accordion__icon"></span></button>
              <div class="accordion__panel"><div><ul><li data-pdp-material></li><li>True to size, with a relaxed shoulder</li><li>Dry clean with a specialist</li></ul></div></div>
            </div>
            <div class="accordion__item">
              <button class="accordion__btn" aria-expanded="false">Delivery &amp; returns <span class="accordion__icon"></span></button>
              <div class="accordion__panel"><div><ul><li>Made to order — ships in three weeks</li><li>Complimentary delivery and returns</li><li>Repaired in our atelier, for life</li></ul></div></div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="section wrap">
      <div class="headrow">
        <h2 class="h2" data-split>You may <em>also like</em></h2>
      </div>
      <div class="products products--home" data-related></div>
    </section>
  </main>

  <script src="js/data.js"></script>
  <script src="js/layout.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/SplitText.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/CustomEase.min.js"></script>
  <script src="https://unpkg.com/lenis@1.3.4/dist/lenis.min.js"></script>
  <script src="js/transition.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
