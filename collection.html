<!doctype html>

<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Collection — Vérane</title>
  <meta name="author" content="Velvané">
  <meta name="description" content="The Vérane Autumn — Winter 2026 collection: coats, tailoring, knitwear and leather goods made in Paris.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%231f1913'/%3E%3Ctext x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-family='Georgia,serif' font-size='44' fill='%23f1e8db'%3EV%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://images.unsplash.com">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>
    document.documentElement.classList.add('js');
    try { if (sessionStorage.getItem('veil')) document.documentElement.classList.add('veil-in'); } catch (e) {}
  </script>
</head>
<body data-page="collection" id="top">

  <!-- Page transition veil -->
  <div class="veil" data-veil aria-hidden="true">
    <div class="veil__col"></div><div class="veil__col"></div><div class="veil__col"></div><div class="veil__col"></div><div class="veil__col"></div>
    <div class="veil__label"><span data-veil-text></span></div>
  </div>

  <main>
    <section class="page-head wrap">
      <div class="page-head__row">
        <h1 class="h1" data-split>Autumn — <em>Winter</em></h1>
      </div>
    </section>

    <div class="filters">
      <div class="wrap filters__inner">
        <div class="filters__list" aria-label="Filter by category">
          <button class="filters__btn is-active" data-filter="All">All</button>
          <button class="filters__btn" data-filter="Outerwear">Outerwear</button>
          <button class="filters__btn" data-filter="Tailoring">Tailoring</button>
          <button class="filters__btn" data-filter="Knitwear">Knitwear</button>
          <button class="filters__btn" data-filter="Leather goods">Leather goods</button>
        </div>
      </div>
    </div>

    <section class="wrap" style="padding-bottom:var(--section)">
      <div class="products products--collection" data-collection></div>
    </section>
  </main>

  <script src="js/data.js"></script>
  <script src="js/layout.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/SplitText.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/CustomEase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/Flip.min.js"></script>
  <script src="https://unpkg.com/lenis@1.3.4/dist/lenis.min.js"></script>
  <script src="js/transition.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
